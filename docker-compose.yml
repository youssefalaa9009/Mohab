# Production stack for a single VPS: Postgres + migrations + the Node app + Caddy (automatic HTTPS).
# Images are built in CI and pulled here — building on a small VPS is slow and memory-hungry.
#
#   docker compose pull && docker compose up -d
#
# Required in .env next to this file: POSTGRES_PASSWORD (URL-safe, e.g. `openssl rand -hex 24`),
# SITE_DOMAIN, QUATTRO_APP_IMAGE, QUATTRO_MIGRATOR_IMAGE, plus the app variables from .env.example.

x-database-url: &database-url postgres://quattro:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/quattro

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quattro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: quattro
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quattro -d quattro"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ${QUATTRO_MIGRATOR_IMAGE:?set QUATTRO_MIGRATOR_IMAGE}
    env_file: .env
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ${QUATTRO_APP_IMAGE:?set QUATTRO_APP_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      # Product photos uploaded in the admin. Back this up with the database.
      - uploads:/app/uploads
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
